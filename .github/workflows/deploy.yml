name: Deploy teaching

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=768
        run: |
          npm ci || npm install
          npm run build

      - name: Package release
        run: |
          mkdir -p release/teaching/frontend/dist release/teaching/frontend/server release/teaching/nginx release/teaching/scripts
          rsync -a frontend/dist/ release/teaching/frontend/dist/
          rsync -a frontend/server/ release/teaching/frontend/server/
          cp nginx/teaching.conf release/teaching/nginx/teaching.conf
          cp scripts/teaching-topic-image.service release/teaching/scripts/teaching-topic-image.service
          tar -czf teaching.tar.gz -C release teaching

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: teaching.tar.gz
          target: /tmp

      - name: Extract and publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            mkdir -p "$HOME/teaching"
            tar -xzf /tmp/teaching.tar.gz -C "$HOME"
            mkdir -p "$HOME/controller/nginx/services.d"
            cp "$HOME/teaching/nginx/teaching.conf" "$HOME/controller/nginx/services.d/teaching.conf"
            mkdir -p "$HOME/.config/systemd/user"
            cp "$HOME/teaching/scripts/teaching-topic-image.service" "$HOME/.config/systemd/user/teaching-topic-image.service"
            if sudo -n loginctl enable-linger "$(whoami)" 2>/dev/null; then
              echo "Enabled systemd user linger for $(whoami)"
            elif loginctl enable-linger 2>/dev/null; then
              echo "Enabled systemd user linger"
            else
              echo "WARNING: could not enable linger; topic-image may stop after logout"
            fi
            systemctl --user daemon-reload
            systemctl --user enable --now teaching-topic-image.service
            systemctl --user restart teaching-topic-image.service
            sleep 1
            systemctl --user --quiet is-active teaching-topic-image.service
            curl -fsS -m 20 "http://127.0.0.1:9010/teaching/api/topic-image?q=healthcheck" >/dev/null
            chmod o+x "$HOME" || true
            chmod -R a+rX "$HOME/teaching" || true
            if sudo -n true 2>/dev/null; then
              sudo nginx -t
              sudo systemctl reload nginx
            else
              echo "Skipped nginx reload (no passwordless sudo). teaching.conf is installed under controller/nginx/services.d/"
            fi
            rm -f /tmp/teaching.tar.gz
